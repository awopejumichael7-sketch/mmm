<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Dashboard — Scholar's Camp</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="brand-bar">
  <img src="logo.png" class="logo" alt="crest">
  <div class="brand-text"><strong>Student Portal</strong><small>Scholar's Camp</small></div>
  <div class="spacer"></div>
  <span id="net-status" title="Online" style="width:10px;height:10px;border-radius:50%;background:#1e8e5a;margin-right:10px;"></span>
  <div id="notif-bell-host" style="position:relative;"></div>
  <button class="icon-btn" id="theme-btn"><i class="fa-solid fa-moon"></i></button>
  <button class="icon-btn" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></button>
</div>

<div class="dash-layout">
  <div class="sidebar">
    <a data-view="overview" class="active"><i class="fa-solid fa-gauge"></i> Overview</a>
    <a data-view="library"><i class="fa-solid fa-book-open"></i> Library</a>
    <a data-view="assignments"><i class="fa-solid fa-upload"></i> Assignments</a>
    <a data-view="calendar"><i class="fa-solid fa-calendar-days"></i> Calendar</a>
    <a data-view="media"><i class="fa-solid fa-photo-film"></i> Audio & Video</a>
    <a data-view="live"><i class="fa-solid fa-tower-broadcast"></i> Live Class</a>
    <a data-view="whiteboard"><i class="fa-solid fa-chalkboard"></i> Whiteboard</a>
    <a data-view="calculator"><i class="fa-solid fa-calculator"></i> Calculator</a>
    <a data-view="dictionary"><i class="fa-solid fa-book"></i> Dictionary</a>
    <a data-view="exams"><i class="fa-solid fa-file-pen"></i> Exams & Results</a>
    <a data-view="certificates"><i class="fa-solid fa-certificate"></i> Certificates</a>
    <a data-view="questions"><i class="fa-solid fa-comments"></i> Ask a Question</a>
    <a data-view="feedback"><i class="fa-solid fa-star"></i> Feedback</a>
  </div>
  <div class="main-content" id="main-content">
    <div class="skeleton" style="height:200px;"></div>
  </div>
</div>

<script type="module" src="student.js"></script>
</body>
</html>
